[package]
name = "herdr-quota"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Rust foundation for the Herdr quota sidebar"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "herdr-quota"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
libc = "0.2"
crossterm = "0.28"
regex = "1.11"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "process", "rt", "signal", "sync", "time"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.20"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "test-util"] }
