><text x="8" y="342" xml:space="preserve">                                    </text><text x="8" y="360" xml:space="preserve">                                    </text><text x="8" y="378" xml:space="preserve">                                    </text><text x="8" y="396" xml:space="preserve">                                    </text><text x="8" y="414" xml:space="preserve">j/k · enter info · p · q            </text></g></svg>