id = "herdr-quota"
name = "AI Quota"
version = "0.2.0"
min_herdr_version = "0.7.3"
description = "A slim right-side view of local AI subscription quota"
platforms = ["macos", "linux"]

[[build]]
command = ["npm", "ci"]

[[build]]
command = ["npm", "run", "build"]

[[panes]]
id = "dashboard"
title = "AI Quota"
placement = "split"
command = ["node", "dist/index.js"]

[[actions]]
id = "open-dashboard"
title = "Open AI quota dashboard"
contexts = ["workspace", "pane"]
command = ["node", "dist/sidebar.js"]
