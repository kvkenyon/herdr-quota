id = "herdr-quota"
name = "AI Quota"
version = "0.4.0"
min_herdr_version = "0.7.3"
description = "A slim right-side view of local AI subscription quota"
platforms = ["macos", "linux"]

[[build]]
command = ["npm", "ci"]

[[build]]
command = ["cargo", "build", "--release", "--locked", "-p", "herdr-quota", "--target-dir", "target"]

[[panes]]
id = "dashboard"
title = "AI Quota"
placement = "split"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/herdr-quota\" dashboard"]

[[actions]]
id = "open-dashboard"
title = "Open AI quota dashboard"
contexts = ["workspace", "pane"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/herdr-quota\" sidebar"]
